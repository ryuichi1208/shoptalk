apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoptalk-api
  labels:
    app: shoptalk-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shoptalk-api
  template:
    metadata:
      labels:
        app: shoptalk-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: shoptalk:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_ROLE
              value: api
            - name: PORT
              value: "8080"
            - name: LAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shoptalk-lab
                  key: token
            - name: AI_URL
              value: http://shoptalk-ai:8081
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: shoptalk-api
spec:
  type: ClusterIP
  selector:
    app: shoptalk-api
  ports:
    - name: http
      port: 8080
      targetPort: http
